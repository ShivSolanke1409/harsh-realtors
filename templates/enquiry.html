{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h3 class="mb-2">Enquire for Commercial Property</h3>
            <p class="text-muted mb-4">
                Our team will contact you shortly on call or WhatsApp.
            </p>

            <form method="POST" action="{% url 'submit_enquiry' %}" class="enquiry-form">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone / WhatsApp Number</label>
        <input type="tel" name="phone" class="form-control" placeholder="Enter mobile number" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Property Type</label>
        <select name="requirement" class="form-select">
            <option>Office</option>
            <option>Shop</option>
            <option>Warehouse</option>
            <option>Other</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Message (Optional)</label>
        <textarea name="requirement" class="form-control" rows="3"
            placeholder="Any specific requirement?"></textarea>
    </div>

    <button type="submit" class="btn btn-danger w-100">
        Submit Enquiry
    </button>
</form>

            <p class="text-center text-muted mt-3 small">
                🔒 Your information is safe and will not be shared
            </p>

        </div>
    </div>
</div>

{% endblock %}
