{% extends 'base.html' %}
{% block content %}

    <div class="row">
        {% for property in properties %}
        <div class="col-md-4 mb-4">
            <div class="card">
                {% if property.image %}
                <img src="{{ property.image.url }}" class="card-img-top">
                {% endif %}

                <div class="card-body">
                    <h5>{{ property.title }}</h5>
                    <p>{{ property.location }}</p>
                    <p><strong>{{ property.price }}</strong></p>
                    <a href="{% url 'property_detail' property.id %}" class="btn btn-outline-primary">
                        View Details
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
